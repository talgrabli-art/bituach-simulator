<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>סימולטור והשוואת תעריפונים – חברות ביטוח</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14243a; --ink-2:#2c4259; --surface:#ffffff; --bg:#eef2f7;
  --panel:#f7f9fc; --line:#dde5ef; --line-2:#cdd8e6;
  --accent:#c8962a; --accent-soft:#fbf2dd;
  --good:#0f7a5a; --good-soft:#e6f3ee; --warn:#b4462f;
  --muted:#6b7c91; --radius:10px;
  --shadow:0 1px 2px rgba(20,36,58,.06),0 8px 24px rgba(20,36,58,.06);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Heebo",system-ui,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:20px 18px 60px}
.tnum{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

.top{display:flex;align-items:center;justify-content:space-between;gap:16px;
  margin-bottom:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:40px;height:40px;border-radius:9px;background:var(--ink);
  display:grid;place-items:center;color:#fff;font-weight:800;font-size:19px;
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.12)}
.logo b{color:var(--accent)}
.brand h1{font-size:18px;margin:0;font-weight:700;letter-spacing:-.2px}
.brand p{margin:1px 0 0;font-size:12.5px;color:var(--muted)}

/* mode switch */
.modeSw{display:inline-flex;background:var(--surface);border:1px solid var(--line);
  border-radius:999px;padding:4px;box-shadow:var(--shadow)}
.modeSw button{border:0;background:transparent;font:inherit;font-weight:700;font-size:13.5px;
  color:var(--muted);padding:8px 18px;border-radius:999px;cursor:pointer;transition:.14s}
.modeSw button.on{background:var(--ink);color:#fff}

.client{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:14px 16px;margin-bottom:14px}
.client .row{display:flex;gap:18px;align-items:flex-end;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:11.5px;font-weight:600;color:var(--muted);letter-spacing:.2px}
.field input[type=number],.field input[type=text],.field select{height:38px;min-width:96px;border:1px solid var(--line-2);
  border-radius:8px;background:#fff;padding:0 11px;font:inherit;font-weight:600;font-size:14px;
  color:var(--ink);outline:none;transition:border-color .15s,box-shadow .15s}
.field input:focus,.field select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.field .sumwide{min-width:140px;text-align:end}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden;height:38px}
.seg button{border:0;background:#fff;font:inherit;font-weight:600;font-size:13.5px;
  padding:0 16px;cursor:pointer;color:var(--ink-2);transition:.12s}
.seg button+button{border-inline-start:1px solid var(--line)}
.seg button.on{background:var(--ink);color:#fff}
.seg.smoke button.on{background:var(--warn)}
.spacer{flex:1}

.client-banner{display:flex;align-items:center;gap:12px;background:linear-gradient(90deg,var(--ink),var(--ink-2));
  color:#fff;border-radius:var(--radius);padding:13px 18px;margin-bottom:14px;box-shadow:var(--shadow)}
.client-banner .cb-label{font-size:11px;font-weight:700;color:#aebfd4;letter-spacing:.6px;
  background:rgba(255,255,255,.1);padding:3px 11px;border-radius:999px}
.client-banner .cb-name{font-size:18px;font-weight:800;letter-spacing:-.2px}

.company-pill{display:flex;align-items:center;gap:8px;background:var(--surface);
  border:1px solid var(--line);border-radius:999px;padding:7px 14px 7px 10px;
  font-size:13px;font-weight:600;box-shadow:var(--shadow)}
.company-pill .dot{width:9px;height:9px;border-radius:50%;background:var(--accent)}
.company-pill select{border:0;background:transparent;font:inherit;font-weight:700;
  color:var(--ink);cursor:pointer;outline:none;padding-inline-start:4px}

.tabs{display:flex;gap:6px;position:relative;z-index:2;flex-wrap:wrap}
.tab{border:1px solid var(--line);border-bottom:0;background:var(--panel);
  border-radius:10px 10px 0 0;padding:11px 22px;font-weight:700;font-size:14px;
  color:var(--muted);cursor:pointer;transition:.12s;margin-bottom:-1px}
.tab.on{background:var(--surface);color:var(--ink);box-shadow:0 -2px 0 var(--accent) inset}

.stage{display:grid;grid-template-columns:1fr 312px;gap:16px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:0 10px 10px 10px;
  box-shadow:var(--shadow);overflow:hidden}
.card.solo{border-radius:10px}

table{width:100%;border-collapse:collapse;font-size:13.5px}
thead th{background:var(--panel);text-align:start;font-weight:600;font-size:11.5px;
  color:var(--muted);letter-spacing:.2px;padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
thead th.num,tbody td.num{text-align:end}
.grp-row td{background:#fbfcfe;font-weight:700;font-size:12px;color:var(--ink-2);
  padding:9px 14px;border-bottom:1px solid var(--line);letter-spacing:.3px}
tbody td{padding:9px 14px;border-bottom:1px solid #eef2f7;vertical-align:middle}
tbody tr.cov:hover{background:#fafcff}
tbody tr.off{opacity:.45}
.cov-name{font-weight:600;color:var(--ink);display:flex;align-items:center;gap:10px}
.chk{appearance:none;width:18px;height:18px;border:1.5px solid var(--line-2);border-radius:5px;
  background:#fff;cursor:pointer;position:relative;flex:none;transition:.12s}
.chk:checked{background:var(--ink);border-color:var(--ink)}
.chk:checked::after{content:"";position:absolute;inset:0;
  background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' fill='none' stroke='white' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><path d='M3.5 8.5l3 3 6-7'/></svg>") center/13px no-repeat}
.base{color:var(--ink-2);font-weight:600}
.disc-cell{position:relative;display:inline-flex;align-items:center}
.disc-cell::after{content:"%";position:absolute;inset-inline-start:9px;font-size:12px;color:var(--muted);font-weight:600;pointer-events:none}
.disc-in{width:74px;height:32px;border:1px solid var(--line-2);border-radius:7px;text-align:center;
  font:inherit;font-weight:700;font-size:13.5px;color:var(--accent);outline:none;background:#fff;
  transition:.12s;padding-inline-start:20px}
.disc-in:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.client-pay{font-weight:800;color:var(--good)}
.sum-in{width:108px;height:32px;border:1px solid var(--line-2);border-radius:7px;text-align:end;
  font:inherit;font-weight:700;font-size:13px;outline:none;padding:0 9px;color:var(--ink)}
.sum-in:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.muted-cell{color:var(--muted);font-size:12px}
.badge{display:inline-block;font-size:10.5px;font-weight:700;color:var(--accent);
  background:var(--accent-soft);border-radius:5px;padding:1px 7px;margin-inline-start:6px}

/* comparison rows */
.cmp-co{font-weight:700;color:var(--ink);display:flex;align-items:center;gap:10px}
.co-dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--accent)}
.cmp-prod{font-size:12px;color:var(--muted);font-weight:500}
tr.best{background:var(--good-soft)!important}
tr.best .client-pay{color:var(--good)}
.rank{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;
  background:var(--panel);font-size:11.5px;font-weight:800;color:var(--ink-2)}
tr.best .rank{background:var(--good);color:#fff}
.pend{color:var(--muted);font-style:normal;font-size:12px;font-weight:600}
.await{color:var(--muted);font-size:12px;background:var(--panel);border-radius:6px;padding:3px 9px;font-weight:600}

.panel{position:sticky;top:16px;background:var(--ink);color:#fff;border-radius:12px;
  padding:20px 20px 18px;box-shadow:0 14px 34px rgba(20,36,58,.22);overflow:hidden}
.panel h3{margin:0 0 2px;font-size:13px;font-weight:600;color:#aebfd4;letter-spacing:.4px}
.panel .total{font-size:42px;font-weight:800;letter-spacing:-1px;line-height:1.05;margin:6px 0 2px}
.panel .total .cur{font-size:22px;font-weight:600;color:var(--accent);margin-inline-start:4px}
.panel .per{font-size:12px;color:#93a6bd;margin-bottom:16px}
.brk{border-top:1px solid rgba(255,255,255,.12);padding-top:14px;display:flex;flex-direction:column;gap:9px}
.brk .l{display:flex;justify-content:space-between;font-size:13px;color:#cdd9e8}
.brk .l b{color:#fff;font-weight:700}
.brk .l.save{color:#7fd9bb}.brk .l.save b{color:#7fd9bb}
.panel .annual{margin-top:14px;background:rgba(255,255,255,.07);border-radius:9px;
  padding:11px 13px;display:flex;justify-content:space-between;align-items:center;font-size:13px}
.panel .annual b{font-size:18px;font-weight:800}
.best-co{margin-top:14px;background:rgba(127,217,187,.12);border:1px solid rgba(127,217,187,.3);
  border-radius:9px;padding:11px 13px;font-size:12.5px;color:#bfeede}
.best-co b{color:#fff;font-weight:800;font-size:15px;display:block;margin-top:2px}
.cta{margin-top:14px;display:flex;gap:8px}
.cta button{flex:1;height:40px;border:0;border-radius:9px;font:inherit;font-weight:700;font-size:13.5px;cursor:pointer;transition:.14s}
.cta .print{background:var(--accent);color:#2a2008}
.cta .reset{background:rgba(255,255,255,.1);color:#dce6f1}
.cta button:hover{transform:translateY(-1px)}
.flash{animation:flash .4s ease}
@keyframes flash{0%{color:var(--accent)}100%{color:#fff}}
.note{font-size:11.5px;color:var(--muted);padding:11px 14px;background:var(--panel);border-top:1px solid var(--line);line-height:1.5}
.subtabs{display:flex;gap:6px;padding:12px 14px 0}
.subtab{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 16px;
  font-weight:700;font-size:13px;color:var(--muted);cursor:pointer;transition:.12s}
.subtab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.cmp-controls{display:flex;gap:14px;align-items:flex-end;padding:14px;flex-wrap:wrap;
  border-bottom:1px solid var(--line);background:#fcfdff}

@media (max-width:920px){.stage{grid-template-columns:1fr}.panel{position:static}}
@media print{body{background:#fff}.panel{background:#fff;color:#000;border:1px solid #000}}
</style>
</head>

  <div id="singleView">

    <div class="stage">

      <div class="panel" id="panel"></div>
    </div>
  </div>

  <div id="compareView" style="display:none">
    <div class="stage">
      <div class="card solo" id="cmpCard"></div>
      <div class="panel" id="cmpPanel"></div>
    </div>
  </div>
</div>

const fmt=n=>n.toLocaleString('he-IL',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmt0=n=>Math.round(n).toLocaleString('he-IL');
const parseSum=s=>Math.max(0,parseFloat(String(s).replace(/[,\s]/g,''))||0);

function ageInBand(age,b){const[lo,hi]=b.split('-').map(Number);return age>=lo&&age<=hi;}
function bandValue(bands,age){for(const k in bands)if(ageInBand(age,k))return bands[k];
  const ks=Object.keys(bands);return bands[ks[ks.length-1]];}

function lifeRate(prod,age,gender,smoke,sum){
  const r=prod.life.rates;let a=Math.min(Math.max(age,18),79);
  while(!r[a]&&a<79)a++;while(!r[a]&&a>18)a--;
  const band=sum>500000?'over500k':'upto500k';return r[a][band][gender][smoke]*(sum/100000);}
function mortRate(prod,age,gender,smoke,sum){
  const r=prod.mortgage.rates;let a=Math.min(Math.max(age,18),84);
  while(!r[a]&&a<84)a++;while(!r[a]&&a>18)a--;return r[a][gender][smoke]*(sum/100000);}
function ci100k(cov,age,gender,smoke,sum){
  let a=Math.min(Math.max(age,1),74);while(!cov.rates[a]&&a<74)a++;while(!cov.rates[a]&&a>1)a--;
  return cov.rates[a][gender][smoke]*(sum/100000);}
const clientPrice=(b,d)=>b*(1-d/100);

const PRODUCTS=[{k:'life',label:'ביטוח חיים'},{k:'mortgage',label:'משכנתא'},{k:'health',label:'בריאות'}];

const tabsEl=document.getElementById('tabs'),tableCard=document.getElementById('tableCard'),panel=document.getElementById('panel');
function prod(){return CO[state.company].products;}
function ensureSel(key,def){if(!state.sel[key])state.sel[key]=Object.assign({on:false,disc:0,sum:100000},def);return state.sel[key];}

function renderTabs(){tabsEl.innerHTML='';PRODUCTS.forEach(p=>{const b=document.createElement('button');
  b.className='tab'+(state.product===p.k?' on':'');b.textContent=p.label;
  b.onclick=()=>{state.product=p.k;renderSingle();};tabsEl.appendChild(b);});}

function buildLifeOrMort(prodKey){
  const isLife=prodKey==='life',key=prodKey,P=prod();
  const s=ensureSel(key,{on:true,sum:isLife?1000000:500000});
  const base=isLife?lifeRate(P,state.age,state.gender,state.smoke,s.sum):mortRate(P,state.age,state.gender,state.smoke,s.sum);
  const disc=s.disc||state.agentDisc,pay=clientPrice(base,disc);
  tableCard.className='card solo';
  tableCard.innerHTML=`<table><thead><tr><th>כיסוי</th><th class="num">סכום ביטוח (₪)</th>
    <th class="num">תעריף בסיס/חודש</th><th class="num">הנחה</th><th class="num">פרמיה ללקוח/חודש</th></tr></thead>
    <tbody><tr class="cov"><td><span class="cov-name">${P[prodKey].label}</span></td>
      <td class="num"><input class="sum-in tnum" id="sum_${key}" value="${s.sum}"></td>
      <td class="num base tnum">${fmt(base)}</td>
      <td class="num"><span class="disc-cell"><input class="disc-in tnum" id="disc_${key}" value="${s.disc||''}" placeholder="${state.agentDisc||0}"></span></td>
      <td class="num client-pay tnum">${fmt(pay)}</td></tr></tbody></table>
    <div class="note">${P[prodKey].note} &nbsp;·&nbsp; הנחה ריקה = הנחת הסוכן (${state.agentDisc||0}%).</div>`;
  document.getElementById('sum_'+key).addEventListener('input',e=>{s.sum=parseSum(e.target.value);s.on=true;recalcSoft();});
  document.getElementById('disc_'+key).addEventListener('input',e=>{s.disc=clampDisc(e.target.value);s.on=true;recalcSoft();});
  s.on=true;
}
function getCov(key){const[,gk,ck]=key.split('.');return prod().health.groups[gk].coverages[ck];}
function buildHealth(){
  const g=prod().health.groups;tableCard.className='card';let rows='';
  for(const gk in g){const grp=g[gk];rows+=`<tr class="grp-row"><td colspan="5">${grp.label}</td></tr>`;
    for(const ck in grp.coverages){const cov=grp.coverages[ck],key='health.'+gk+'.'+ck,per=!!cov.per100k;
      const s=ensureSel(key,{on:false,sum:100000});let base=0,sumCell='—';
      if(per){base=ci100k(cov,state.age,state.gender,state.smoke,s.sum);sumCell=`<input class="sum-in tnum" data-sum="${key}" value="${s.sum}">`;}
      else if(cov.gender)base=bandValue(cov.bands,state.age)[state.gender];else base=bandValue(cov.bands,state.age);
      const disc=s.disc||state.agentDisc,pay=clientPrice(base,disc);
      rows+=`<tr class="cov ${s.on?'':'off'}" data-row="${key}">
        <td><span class="cov-name"><input type="checkbox" class="chk" data-on="${key}" ${s.on?'checked':''}>
        ${cov.label}${per?'<span class="badge">לכל 100K</span>':''}</span></td>
        <td class="num ${per?'':'muted-cell'}">${sumCell}</td>
        <td class="num base tnum">${fmt(base)}</td>
        <td class="num"><span class="disc-cell"><input class="disc-in tnum" data-disc="${key}" value="${s.disc||''}" placeholder="${state.agentDisc||0}"></span></td>
        <td class="num client-pay tnum">${fmt(pay)}</td></tr>`;}}
  tableCard.innerHTML=`<table><thead><tr><th>כיסוי</th><th class="num">סכום (₪)</th>
    <th class="num">תעריף בסיס</th><th class="num">הנחה</th><th class="num">פרמיה ללקוח</th></tr></thead>

  tableCard.querySelectorAll('[data-on]').forEach(c=>c.addEventListener('change',e=>{state.sel[e.target.dataset.on].on=e.target.checked;renderSingle();}));
  tableCard.querySelectorAll('[data-disc]').forEach(c=>c.addEventListener('input',e=>{state.sel[e.target.dataset.disc].disc=clampDisc(e.target.value);state.sel[e.target.dataset.disc].on=true;recalcSoft();}));
  tableCard.querySelectorAll('[data-sum]').forEach(c=>c.addEventListener('input',e=>{state.sel[e.target.dataset.sum].sum=parseSum(e.target.value);recalcSoft();}));
}
function recalcSoft(){
  if(state.product==='life'||state.product==='mortgage'){const key=state.product,s=state.sel[key],P=prod();
    const base=key==='life'?lifeRate(P,state.age,state.gender,state.smoke,s.sum):mortRate(P,state.age,state.gender,state.smoke,s.sum);
    const disc=s.disc||state.agentDisc;
    tableCard.querySelector('.base').textContent=fmt(base);
    tableCard.querySelector('.client-pay').textContent=fmt(clientPrice(base,disc));}
  else{tableCard.querySelectorAll('tr.cov').forEach(tr=>{const key=tr.dataset.row,cov=getCov(key),s=state.sel[key];
    let base;if(cov.per100k)base=ci100k(cov,state.age,state.gender,state.smoke,s.sum);
    else if(cov.gender)base=bandValue(cov.bands,state.age)[state.gender];else base=bandValue(cov.bands,state.age);
    const disc=s.disc||state.agentDisc;tr.querySelector('.base').textContent=fmt(base);
    tr.querySelector('.client-pay').textContent=fmt(clientPrice(base,disc));});}
  renderPanel();
}
function totals(){let base=0,pay=0,items=[];const P=prod();
  if(state.product==='life'||state.product==='mortgage'){const key=state.product,s=state.sel[key];
    if(s&&s.on){const b=key==='life'?lifeRate(P,state.age,state.gender,state.smoke,s.sum):mortRate(P,state.age,state.gender,state.smoke,s.sum);
      const d=s.disc||state.agentDisc;base+=b;pay+=clientPrice(b,d);items.push([P[key].label,clientPrice(b,d)]);}}
  else{for(const key in state.sel){if(!key.startsWith('health.'))continue;const s=state.sel[key];if(!s.on)continue;
    const cov=getCov(key);let b;if(cov.per100k)b=ci100k(cov,state.age,state.gender,state.smoke,s.sum);
    else if(cov.gender)b=bandValue(cov.bands,state.age)[state.gender];else b=bandValue(cov.bands,state.age);
    const d=s.disc||state.agentDisc;base+=b;pay+=clientPrice(b,d);items.push([cov.label,clientPrice(b,d)]);}}
  return{base,pay,save:base-pay,items};}
let lastPay=0;
function renderPanel(){const t=totals();const flash=Math.abs(t.pay-lastPay)>0.001?'flash':'';lastPay=t.pay;
  panel.innerHTML=`<h3>פרמיה חודשית ללקוח</h3>
    <div class="total tnum ${flash}">${fmt0(t.pay)}<span class="cur">₪</span></div>
    <div class="per">${t.items.length} כיסויים · ${CO[state.company].name} · ${PRODUCTS.find(p=>p.k===state.product).label}</div>
    <div class="brk"><div class="l">תעריף בסיס (לפני הנחה)<b class="tnum">${fmt(t.base)} ₪</b></div>
      <div class="l save">חיסכון מהנחות<b class="tnum">${fmt(t.save)} ₪</b></div></div>
    <div class="annual">פרמיה שנתית<b class="tnum">${fmt0(t.pay*12)} ₪</b></div>
    <div class="cta"><button class="print" onclick="window.print()">הדפסה / PDF</button>
      <button class="reset" id="resetBtn">איפוס</button></div>`;
  document.getElementById('resetBtn').onclick=()=>{state.sel={};renderSingle();};
}
function renderSingle(){renderTabs();
  if(state.product==='life')buildLifeOrMort('life');
  else if(state.product==='mortgage')buildLifeOrMort('mortgage');else buildHealth();
  renderPanel();}

/* ===================== COMPARE MODE ===================== */
const cmpCard=document.getElementById('cmpCard'),cmpPanel=document.getElementById('cmpPanel');
const CMP_KINDS=[{k:'life',label:'ריסק (ביטוח חיים)'},{k:'ci',label:'מחלות קשות'}];

// build comparison rows across all companies
function compareRows(){
  const rows=[];
  ORDER.forEach(id=>{
    const c=CO[id];
    if(!c.products){rows.push({co:id,name:c.name,await:true});return;}
    if(state.cmpKind==='life'){
      if(!c.products.life){rows.push({co:id,name:c.name,await:true});return;}
      const base=lifeRate(c.products,state.age,state.gender,state.smoke,state.cmpSum);
      rows.push({co:id,name:c.name,prodLabel:c.products.life.label,base,disc:state.agentDisc,pay:clientPrice(base,state.agentDisc)});
    } else {
      // critical illness: one row per CI coverage the company has
      const grp=c.products.health&&c.products.health.groups.machalot_kashot;
      if(!grp){rows.push({co:id,name:c.name,await:true});return;}
      for(const ck in grp.coverages){const cov=grp.coverages[ck];
        const base=ci100k(cov,state.age,state.gender,state.smoke,state.cmpSum);
        rows.push({co:id,name:c.name,prodLabel:cov.label,base,disc:state.agentDisc,pay:clientPrice(base,state.agentDisc)});}
    }
  });
  return rows;
}
function refreshCompare(){renderCompare();}
function renderCompare(){
  const kindLabel=CMP_KINDS.find(k=>k.k===state.cmpKind).label;
  let rows=compareRows();
  const priced=rows.filter(r=>!r.await).sort((a,b)=>a.pay-b.pay);
  const awaiting=rows.filter(r=>r.await);
  const best=priced[0];
  let body='';let rank=0;
  priced.forEach(r=>{rank++;
    body+=`<tr class="cov ${rank===1?'best':''}">
      <td><span class="cmp-co"><span class="rank">${rank}</span><span class="cmp-co">${r.name}</span></span>
        <div class="cmp-prod">${r.prodLabel}</div></td>
      <td class="num base tnum">${fmt(r.base)}</td>
      <td class="num"><span class="disc-cell"><input class="disc-in tnum" data-cdisc="${r.co}" value="" placeholder="${state.agentDisc||0}"></span></td>
      <td class="num client-pay tnum">${fmt(r.pay)} ₪</td>
      <td class="num pend tnum">${fmt0(r.pay*12)} ₪</td></tr>`;});
  awaiting.forEach(r=>{body+=`<tr class="cov off"><td><span class="cmp-co"><span class="rank">–</span>${r.name}</span></td>
      <td colspan="4" class="num"><span class="await">טרם הוזן תעריפון</span></td></tr>`;});
  cmpCard.innerHTML=`
    <div class="subtabs">${CMP_KINDS.map(k=>`<button class="subtab ${state.cmpKind===k.k?'on':''}" data-kind="${k.k}">${k.label}</button>`).join('')}</div>
    <div class="cmp-controls">
      <div class="field"><label>סכום ${state.cmpKind==='ci'?'פיצוי':'ביטוח'} (₪)</label>
        <input type="text" id="cmpSum2" class="sumwide tnum" value="${state.cmpSum.toLocaleString('he-IL')}"></div>
      <div class="spacer"></div>
      <div class="field"><label>מציג</label>
        <div style="height:38px;display:flex;align-items:center;font-weight:700;font-size:14px;color:var(--ink-2)">${priced.length} חברות/מסלולים מתומחרים</div></div>
    </div>
    <table><thead><tr><th>חברה / מסלול</th><th class="num">תעריף בסיס</th>
      <th class="num">הנחה</th><th class="num">פרמיה חודשית</th><th class="num">שנתי</th></tr></thead>
      <tbody>${body}</tbody></table>
    <div class="note">השוואת ${kindLabel} · גיל ${state.age} · ${state.gender==='M'?'גבר':'אישה'} · ${state.smoke==='smk'?'מעשן':'לא מעשן'} · סכום ${state.cmpSum.toLocaleString('he-IL')} ₪. הזן הנחה ספציפית לחברה כדי לדרוס את הנחת הסוכן.</div>`;
  // wire sub-tabs, sum, per-company discount
  cmpCard.querySelectorAll('[data-kind]').forEach(b=>b.onclick=()=>{state.cmpKind=b.dataset.kind;
    state.cmpSum=state.cmpKind==='ci'?100000:1000000;renderCompare();});
  const s2=document.getElementById('cmpSum2');
  s2.addEventListener('input',e=>{state.cmpSum=parseSum(e.target.value);liveCompare();});
  s2.addEventListener('blur',e=>{e.target.value=state.cmpSum.toLocaleString('he-IL');});
  cmpCard.querySelectorAll('[data-cdisc]').forEach(i=>i.addEventListener('input',()=>liveCompare()));
  renderCmpPanel(best,priced);
}
function liveCompare(){
  // recompute pay using per-company discount overrides without losing focus
  const over={};cmpCard.querySelectorAll('[data-cdisc]').forEach(i=>{const v=i.value.trim();if(v!=='')over[i.dataset.cdisc]=clampDisc(v);});
  const trs=[...cmpCard.querySelectorAll('tbody tr.cov')].filter(tr=>!tr.classList.contains('off'));
  // rebuild numbers from current sum, keep order (no re-sort to keep focus)
  let rows=compareRows().filter(r=>!r.await);
  const map={};rows.forEach(r=>{map[r.co]=map[r.co]||[];map[r.co].push(r);});
  // recompute by matching co+prodLabel in DOM order
  trs.forEach(tr=>{
    const co=tr.querySelector('[data-cdisc]').dataset.cdisc;
    const prodLabel=tr.querySelector('.cmp-prod')?tr.querySelector('.cmp-prod').textContent:'';
    const r=(map[co]||[]).find(x=>x.prodLabel===prodLabel)||(map[co]||[])[0];if(!r)return;
    const d=(co in over)?over[co]:state.agentDisc;const pay=clientPrice(r.base,d);
    tr.querySelector('.base').textContent=fmt(r.base);
    tr.querySelector('.client-pay').textContent=fmt(pay)+' ₪';
    tr.querySelector('.pend').textContent=fmt0(pay*12)+' ₪';});
  // update panel best
  let priced=rows.map(r=>{const d=(r.co in over)?over[r.co]:state.agentDisc;return{...r,pay:clientPrice(r.base,d)};}).sort((a,b)=>a.pay-b.pay);
  renderCmpPanel(priced[0],priced);
}
function renderCmpPanel(best,priced){
  if(!best){cmpPanel.innerHTML='<h3>אין נתונים</h3>';return;}
  const worst=priced[priced.length-1];const spread=worst.pay-best.pay;
  cmpPanel.innerHTML=`<h3>הפרמיה הזולה ביותר</h3>
    <div class="total tnum">${fmt0(best.pay)}<span class="cur">₪</span></div>
    <div class="per">לחודש · ${state.cmpKind==='ci'?'מחלות קשות':'ריסק'} · ${state.cmpSum.toLocaleString('he-IL')} ₪</div>
    <div class="best-co">החברה המשתלמת ביותר<b>${best.name}</b>
      <span style="color:#bfeede;font-size:11.5px">${best.prodLabel}</span></div>
    <div class="brk"><div class="l">יקרה ביותר<b class="tnum">${fmt0(worst.pay)} ₪</b></div>
      <div class="l save">פער חודשי בין החברות<b class="tnum">${fmt0(spread)} ₪</b></div>
      <div class="l save">פער שנתי<b class="tnum">${fmt0(spread*12)} ₪</b></div></div>
    <div class="annual">שנתי (הזולה)<b class="tnum">${fmt0(best.pay*12)} ₪</b></div>
    <div class="cta"><button class="print" onclick="window.print()">הדפסה / PDF</button></div>`;
}

/* ===================== ROOT RENDER ===================== */
function render(){
  const single=state.mode==='single';
  document.getElementById('singleView').style.display=single?'':'none';
  document.getElementById('compareView').style.display=single?'none':'';
  document.getElementById('companyField').style.display=single?'':'none';
  document.getElementById('cmpSumField').style.display='none';
  if(single)renderSingle(); else renderCompare();
}

/* ---- URL parameter pre-fill (for the Fireberry button) ---- */
(function prefill(){
  const q=new URLSearchParams(location.search);
  const nm=(q.get('name')||q.get('accountname')||'').trim();
  if(nm && nm!=='{accountname}'){
    document.getElementById('cbName').textContent=nm;
    document.getElementById('clientBanner').style.display='flex';
    document.title=nm+' · סימולטור תעריפונים';
  }
  const setSeg=(id,v)=>{const seg=document.getElementById(id);if(!seg)return;
    seg.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));};
  if(q.has('age')){const a=parseInt(q.get('age'));if(!isNaN(a)){state.age=a;document.getElementById('age').value=a;}}
  let g=q.get('gender');if(g){g=g.toLowerCase().trim();
    if(['m','male','זכר','גבר','1'].includes(g))state.gender='M';
    else if(['f','female','נקבה','אישה','2'].includes(g))state.gender='F';
    setSeg('genderSeg',state.gender);}
  let s=(q.get('smoke')||q.get('smoker')||'');if(s){s=s.toLowerCase().trim();
    state.smoke=['1','true','yes','smk','smoker','כן','מעשן'].includes(s)?'smk':'non';
    setSeg('smokeSeg',state.smoke);}
  if(q.has('disc')){const d=clampDisc(q.get('disc'));state.agentDisc=d;document.getElementById('agentDisc').value=d;}
  if(q.has('sum')){const v=parseSum(q.get('sum'));if(v){state.cmpSum=v;}}
  if(q.get('mode')==='compare'){state.mode='compare';
    document.getElementById('modeSw').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.m==='compare'));}
  if(['life','mortgage','health'].includes(q.get('product')))state.product=q.get('product');
  if(['life','ci'].includes(q.get('cmp')))state.cmpKind=q.get('cmp');
})();

render();
</script>
