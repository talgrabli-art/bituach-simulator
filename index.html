<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>סימולטור והשוואת תעריפונים – חברות ביטוח</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14243a; --ink-2:#2c4259; --surface:#ffffff; --bg:#f2f5fa;
  --panel:#f7f9fc; --line:#e3e9f1; --line-2:#d3dde9;
  --accent:#c8962a; --accent-soft:#fbf2dd;
  --good:#0f7a5a; --good-soft:#e6f3ee; --warn:#b4462f;
  --muted:#6b7c91; --radius:10px;
  --shadow:0 1px 2px rgba(20,36,58,.06),0 8px 24px rgba(20,36,58,.06);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Heebo",system-ui,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:20px 18px 60px}
.tnum{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

.top{display:flex;align-items:center;justify-content:space-between;gap:16px;
  margin-bottom:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:50px;height:50px;border-radius:11px;background:#fff;
  display:grid;place-items:center;box-shadow:var(--shadow);padding:6px;border:1px solid var(--line)}
.logo img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.brand h1{font-size:18px;margin:0;font-weight:700;letter-spacing:-.2px}
.brand p{margin:1px 0 0;font-size:12.5px;color:var(--muted)}

/* mode switch */
.modeSw{display:inline-flex;background:var(--surface);border:1px solid var(--line);
  border-radius:999px;padding:4px;box-shadow:var(--shadow)}
.modeSw button{border:0;background:transparent;font:inherit;font-weight:700;font-size:13.5px;
  color:var(--muted);padding:8px 18px;border-radius:999px;cursor:pointer;transition:.14s}
.modeSw button.on{background:var(--ink);color:#fff}

.client{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:14px 16px;margin-bottom:14px}
.client .row{display:flex;gap:18px;align-items:flex-end;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:11.5px;font-weight:600;color:var(--muted);letter-spacing:.2px}
.field input[type=number],.field input[type=text],.field select{height:38px;min-width:96px;border:1px solid var(--line-2);
  border-radius:8px;background:#fff;padding:0 11px;font:inherit;font-weight:600;font-size:14px;
  color:var(--ink);outline:none;transition:border-color .15s,box-shadow .15s}
.field input:focus,.field select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.field .sumwide{min-width:140px;text-align:end}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden;height:38px}
.seg button{border:0;background:#fff;font:inherit;font-weight:600;font-size:13.5px;
  padding:0 16px;cursor:pointer;color:var(--ink-2);transition:.12s}
.seg button+button{border-inline-start:1px solid var(--line)}
.seg button.on{background:var(--ink);color:#fff}
.seg.smoke button.on{background:var(--warn)}
.spacer{flex:1}

.client-banner{display:flex;align-items:center;gap:12px;background:linear-gradient(90deg,var(--ink),var(--ink-2));
  color:#fff;border-radius:var(--radius);padding:13px 18px;margin-bottom:14px;box-shadow:var(--shadow)}
.client-banner .cb-label{font-size:11px;font-weight:700;color:#aebfd4;letter-spacing:.6px;
  background:rgba(255,255,255,.1);padding:3px 11px;border-radius:999px}
.client-banner .cb-name{font-size:18px;font-weight:800;letter-spacing:-.2px}

.company-pill{display:flex;align-items:center;gap:8px;background:var(--surface);
  border:1px solid var(--line);border-radius:999px;padding:7px 14px 7px 10px;
  font-size:13px;font-weight:600;box-shadow:var(--shadow)}
.company-pill .dot{width:9px;height:9px;border-radius:50%;background:var(--accent)}
.company-pill select{border:0;background:transparent;font:inherit;font-weight:700;
  color:var(--ink);cursor:pointer;outline:none;padding-inline-start:4px}

.tabs{display:flex;gap:6px;position:relative;z-index:2;flex-wrap:wrap}
.tab{border:1px solid var(--line);border-bottom:0;background:var(--panel);
  border-radius:10px 10px 0 0;padding:11px 22px;font-weight:700;font-size:14px;
  color:var(--muted);cursor:pointer;transition:.12s;margin-bottom:-1px}
.tab.on{background:var(--surface);color:var(--ink);box-shadow:0 -2px 0 var(--accent) inset}

.stage{display:grid;grid-template-columns:1fr 312px;gap:16px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:0 10px 10px 10px;
  box-shadow:var(--shadow);overflow:hidden}
.card.solo{border-radius:10px}

table{width:100%;border-collapse:collapse;font-size:13.5px}
thead th{background:var(--panel);text-align:start;font-weight:600;font-size:11.5px;
  color:var(--muted);letter-spacing:.2px;padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
thead th.num,tbody td.num{text-align:end}
.grp-row td{background:#fbfcfe;font-weight:700;font-size:12px;color:var(--ink-2);
  padding:9px 14px;border-bottom:1px solid var(--line);letter-spacing:.3px}
tbody td{padding:9px 14px;border-bottom:1px solid #eef2f7;vertical-align:middle}
tbody tr.cov:hover{background:#fafcff}
tbody tr.off{opacity:.45}
.cov-name{font-weight:600;color:var(--ink);display:flex;align-items:center;gap:10px}
.chk{appearance:none;width:18px;height:18px;border:1.5px solid var(--line-2);border-radius:5px;
  background:#fff;cursor:pointer;position:relative;flex:none;transition:.12s}
.chk:checked{background:var(--ink);border-color:var(--ink)}
.chk:checked::after{content:"";position:absolute;inset:0;
  background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' fill='none' stroke='white' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><path d='M3.5 8.5l3 3 6-7'/></svg>") center/13px no-repeat}
.base{color:var(--ink-2);font-weight:600}
.disc-cell{position:relative;display:inline-flex;align-items:center}
.disc-cell::after{content:"%";position:absolute;inset-inline-start:9px;font-size:12px;color:var(--muted);font-weight:600;pointer-events:none}
.disc-in{width:74px;height:32px;border:1px solid var(--line-2);border-radius:7px;text-align:center;
  font:inherit;font-weight:700;font-size:13.5px;color:var(--accent);outline:none;background:#fff;
  transition:.12s;padding-inline-start:20px}
.disc-in:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.client-pay{font-weight:800;color:var(--good)}
.sum-in{width:108px;height:32px;border:1px solid var(--line-2);border-radius:7px;text-align:end;
  font:inherit;font-weight:700;font-size:13px;outline:none;padding:0 9px;color:var(--ink)}
.sum-in:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.muted-cell{color:var(--muted);font-size:12px}
.badge{display:inline-block;font-size:10.5px;font-weight:700;color:var(--accent);
  background:var(--accent-soft);border-radius:5px;padding:1px 7px;margin-inline-start:6px}

/* comparison rows */
.cmp-co{font-weight:700;color:var(--ink);display:flex;align-items:center;gap:10px}
.co-dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--accent)}
.cmp-prod{font-size:12px;color:var(--muted);font-weight:500}
tr.best{background:var(--good-soft)!important}
tr.best .client-pay{color:var(--good)}
.rank{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;
  background:var(--panel);font-size:11.5px;font-weight:800;color:var(--ink-2)}
tr.best .rank{background:var(--good);color:#fff}
.pend{color:var(--muted);font-style:normal;font-size:12px;font-weight:600}
.await{color:var(--muted);font-size:12px;background:var(--panel);border-radius:6px;padding:3px 9px;font-weight:600}

.panel{position:sticky;top:16px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:14px;
  padding:18px 18px 16px;box-shadow:0 10px 30px rgba(20,36,58,.07);overflow:hidden}
.panel h3{margin:0;font-size:11.5px;font-weight:700;color:var(--muted);letter-spacing:.3px}
.panel .total{font-size:38px;font-weight:800;letter-spacing:-1.5px;line-height:1;margin:5px 0 3px;color:var(--ink)}
.panel .total .cur{font-size:20px;font-weight:700;color:var(--accent);margin-inline-start:3px}
.panel .per{font-size:11.5px;color:var(--muted);margin-bottom:14px}
.brk{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.brk .l{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-2)}
.brk .l b{color:var(--ink);font-weight:700}
.brk .l.save{color:var(--good)}.brk .l.save b{color:var(--good)}
.brk .l.year{border-top:1px dashed var(--line);padding-top:9px;margin-top:1px}
.brk .l.year b{font-size:16px}
.cta-primary{margin-top:14px;width:100%;border:0;background:var(--accent);color:#1d1402;font-weight:800;
  padding:13px;border-radius:10px;cursor:pointer;font-size:14px;box-shadow:0 6px 16px rgba(200,150,42,.26);transition:.14s}
.cta-primary:hover{transform:translateY(-1px);box-shadow:0 9px 22px rgba(200,150,42,.34)}
.best-co{margin-top:12px;background:var(--good-soft);border:1px solid rgba(15,122,90,.2);
  border-radius:10px;padding:11px 13px;font-size:12px;color:#0c6e52}
.best-co b{color:var(--ink);font-weight:800;font-size:15px;display:block;margin-top:2px}
.best-co span{display:block;color:var(--muted);font-size:11px;margin-top:1px}
.cta{margin-top:8px;display:flex;gap:8px}
.cta button{flex:1;height:38px;border:1px solid var(--line-2);background:#fff;border-radius:9px;font:inherit;font-weight:700;font-size:12.5px;cursor:pointer;transition:.14s;color:var(--ink-2)}
.cta .print{background:var(--ink);color:#fff;border-color:var(--ink)}
.cta button:hover{transform:translateY(-1px)}
.flash{animation:flash .4s ease}
@keyframes flash{0%{color:var(--accent)}100%{color:var(--ink)}}
/* family mode */
#familyBar{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 14px;margin-bottom:14px;box-shadow:0 6px 18px rgba(20,36,58,.05)}
.fam-inner{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.fam-title{font-size:12px;font-weight:800;color:var(--muted);white-space:nowrap}
.fam-chips{display:flex;gap:8px;flex-wrap:wrap;flex:1}
.fam-chip{display:inline-flex;align-items:center;gap:9px;border:1px solid var(--line-2);background:#fff;border-radius:999px;padding:6px 6px 6px 13px;cursor:pointer;font-size:13px;font-weight:700;color:var(--ink-2);transition:.12s}
.fam-chip:hover{border-color:var(--accent)}
.fam-chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.fam-chip .fc-age{font-size:11px;color:var(--muted);font-weight:600}
.fam-chip.on .fc-age{color:#aebfd4}
.fam-chip .fc-x{border:0;background:rgba(0,0,0,.06);color:inherit;width:20px;height:20px;border-radius:50%;cursor:pointer;font-size:12px;line-height:1}
.fam-chip.on .fc-x{background:rgba(255,255,255,.2)}
.fam-add{border:1px dashed var(--line-2);background:var(--panel);color:var(--ink-2);border-radius:999px;padding:7px 15px;cursor:pointer;font-size:12.5px;font-weight:700;white-space:nowrap;transition:.12s}
.fam-add:hover{border-color:var(--accent);color:var(--ink)}
.fam-empty{font-size:12.5px;color:var(--muted)}
.fam-sub{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px}
.fam-sub button{border:0;background:transparent;font:inherit;font-weight:700;font-size:12px;padding:6px 12px;border-radius:7px;cursor:pointer;color:var(--ink-2);transition:.12s}
.fam-sub button.on{background:var(--ink);color:#fff}
.cart-member{padding:10px 18px 5px;font-size:12.5px;font-weight:800;color:var(--ink);background:var(--panel);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.cart-member b{color:var(--good);font-weight:800}
.note{font-size:11.5px;color:var(--muted);padding:11px 14px;background:var(--panel);border-top:1px solid var(--line);line-height:1.5}
.subtabs{display:flex;gap:6px;padding:12px 14px 0}
.subtab{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 16px;
  font-weight:700;font-size:13px;color:var(--muted);cursor:pointer;transition:.12s}
.subtab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.cmp-controls{display:flex;gap:14px;align-items:flex-end;padding:14px;flex-wrap:wrap;
  border-bottom:1px solid var(--line);background:#fcfdff}

@media (max-width:920px){.stage{grid-template-columns:1fr}.panel{position:static}}
@media print{body{background:#fff}.panel{background:#fff;color:#000;border:1px solid #000}}

/* offer cart */
.cart{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.cart-head{display:flex;align-items:center;justify-content:space-between;padding:13px 18px;background:var(--ink);color:#fff}
.cart-head h3{margin:0;font-size:15px;font-weight:800}
.cart-head .ct-count{font-size:12px;color:#bfd0e2}
.cart-body{padding:2px 0}
.cart-empty{padding:22px 18px;text-align:center;color:var(--muted);font-size:13px}
.cart-row{display:flex;align-items:center;gap:12px;padding:11px 18px;border-bottom:1px solid var(--line)}
.cart-row:last-child{border-bottom:0}
.cart-row .ci-co{font-weight:800;font-size:13px;min-width:118px}
.cart-row .ci-label{flex:1;font-size:13px;color:var(--ink-2)}
.cart-row .ci-pay{font-weight:800;font-size:14.5px;color:var(--good);min-width:78px;text-align:start}
.cart-row .ci-x{border:0;background:var(--accent-soft);color:var(--warn);width:27px;height:27px;border-radius:7px;cursor:pointer;font-size:14px;line-height:1;flex:none}
.cart-row .ci-x:hover{background:#f3ddd6}
.cart-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:13px 18px;background:var(--panel);border-top:1px solid var(--line)}
.cart-foot .ct-tot{font-size:13px;color:var(--muted)}
.cart-foot .ct-tot b{font-size:20px;color:var(--ink);margin-inline-start:6px}
.cart-foot .ct-actions{display:flex;gap:8px}
.btn-add{margin:12px 0 2px;width:100%;border:0;background:var(--accent);color:#1d1402;font-weight:800;padding:11px;border-radius:9px;cursor:pointer;font-size:13.5px}
.btn-add:hover{filter:brightness(1.05)}
.btn-ghost{border:1px solid var(--line-2);background:#fff;color:var(--ink);padding:9px 14px;border-radius:8px;cursor:pointer;font-weight:700;font-size:12.5px}
.btn-print{border:0;background:var(--ink);color:#fff;padding:9px 16px;border-radius:8px;cursor:pointer;font-weight:700;font-size:12.5px}
.ci-add{border:0;background:var(--good-soft);color:var(--good);width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:18px;font-weight:800;line-height:1}
.ci-add:hover{background:#d6 ebe2;background:#cfe9df}
@media print{.cart{box-shadow:none;border:1px solid #000}.cart-head{background:#fff;color:#000;border-bottom:1px solid #000}.btn-print,.btn-ghost,.ci-add,.btn-add{display:none}}
</style>
</head>

function ageInBand(age,b){const p=b.split('-');const lo=+p[0];const hi=p.length>1?+p[1]:lo;return age>=lo&&age<=hi;}
function bandValue(bands,age){for(const k in bands)if(ageInBand(age,k))return bands[k];
  const ks=Object.keys(bands);return bands[ks[ks.length-1]];}

function lifeRate(prod,age,gender,smoke,sum){
  if(!(age>=1))return 0;
  const r=prod.life.rates;const keys=Object.keys(r).map(Number);
  const mn=Math.min(...keys),mx=Math.max(...keys);
  let a=Math.min(Math.max(age,mn),mx);while(!r[a]&&a<mx)a++;while(!r[a]&&a>mn)a--;
  let cell=r[a];
  if(cell.over500k||cell.upto500k){cell=sum>500000?cell.over500k:cell.upto500k;}
  return cell[gender][smoke]*(sum/100000);}
function mortRate(prod,age,gender,smoke,sum){
  if(!(age>=1))return 0;
  const r=prod.mortgage.rates;let a=Math.min(Math.max(age,18),84);
  while(!r[a]&&a<84)a++;while(!r[a]&&a>18)a--;return r[a][gender][smoke]*(sum/100000);}
function ci100k(cov,age,gender,smoke,sum){
  if(!(age>=1))return 0;
  const keys=Object.keys(cov.rates).map(Number);const mn=Math.min(...keys),mx=Math.max(...keys);
  let a=Math.min(Math.max(age,mn),mx);while(!cov.rates[a]&&a<mx)a++;while(!cov.rates[a]&&a>mn)a--;
  return cov.rates[a][gender][smoke]*(sum/100000);}

const cmpCard=document.getElementById('cmpCard'),cmpPanel=document.getElementById('cmpPanel');
const CMP_KINDS=[{k:'life',label:'ריסק (ביטוח חיים)'},{k:'mk',label:'מחלות קשות'},{k:'cancer',label:'פיצוי לסרטן'}];

// build comparison rows across all companies
function compareRows(){
  const rows=[];
  ORDER.forEach(id=>{
    const c=CO[id];
    if(!c.products){rows.push({co:id,name:c.name,await:true});return;}
    if(state.cmpKind==='life'){
      if(!c.products.life){rows.push({co:id,name:c.name,await:true});return;}
      const base=lifeRate(c.products,state.age,state.gender,state.smoke,state.cmpSum);
      rows.push({co:id,coId:id,covKey:'life',name:c.name,prodLabel:c.products.life.label,base,disc:state.agentDisc,pay:clientPrice(base,state.agentDisc)});
    } else {
      // critical illness / cancer: one row per matching coverage the company has
      const grp=c.products.health&&c.products.health.groups.machalot_kashot;
      if(!grp){rows.push({co:id,name:c.name,await:true});return;}
      const matching=Object.keys(grp.coverages).filter(ck=>(grp.coverages[ck].catg||'mk')===state.cmpKind);
      if(!matching.length){rows.push({co:id,name:c.name,await:true});return;}
      for(const ck of matching){const cov=grp.coverages[ck];
        const base=ci100k(cov,state.age,state.gender,state.smoke,state.cmpSum);
        rows.push({co:id,coId:id,covKey:ck,name:c.name,prodLabel:cov.label,base,disc:state.agentDisc,pay:clientPrice(base,state.agentDisc)});}
    }
  });
  return rows;
}
function refreshCompare(){renderCompare();}

    btn.textContent='✓';setTimeout(()=>{btn.textContent='＋';},900);

function liveCompare(){
  // recompute pay using per-company discount overrides, then re-sort rows live
  const over={};cmpCard.querySelectorAll('[data-cdisc]').forEach(i=>{const v=i.value.trim();if(v!=='')over[i.dataset.cdisc]=clampDisc(v);});
  let rows=compareRows().filter(r=>!r.await);
  const trs=[...cmpCard.querySelectorAll('tbody tr.cov')].filter(tr=>!tr.classList.contains('off'));
  const used=new Set();
  const items=trs.map(tr=>{
    const co=tr.querySelector('[data-cdisc]')?tr.querySelector('[data-cdisc]').dataset.cdisc:'';
    const prodLabel=tr.querySelector('.cmp-prod')?tr.querySelector('.cmp-prod').textContent:'';
    let idx=rows.findIndex((r,i)=>r.co===co&&r.prodLabel===prodLabel&&!used.has(i));
    if(idx<0)idx=rows.findIndex((r,i)=>r.co===co&&!used.has(i));
    used.add(idx);const r=rows[idx]||{base:0,co,prodLabel};
    const d=(co in over)?over[co]:state.agentDisc;const pay=clientPrice(r.base,d);
    tr.querySelector('.base').textContent=fmt(r.base);
    tr.querySelector('.client-pay').textContent=fmt(pay)+' ₪';
    tr.querySelector('.pend').textContent=fmt0(pay*12)+' ₪';
    return {tr,pay,r};
  });
  items.sort((a,b)=>a.pay-b.pay);
  const tb=cmpCard.querySelector('tbody');
  items.forEach((it,i)=>{tb.appendChild(it.tr);
    const rk=it.tr.querySelector('.rank');if(rk)rk.textContent=i+1;
    it.tr.classList.toggle('best',i===0);});
  cmpCard.querySelectorAll('tbody tr.cov.off').forEach(tr=>tb.appendChild(tr));
  const priced=items.map(it=>({...it.r,pay:it.pay}));
  renderCmpPanel(priced[0],priced);
}

      <div class="ct-tot">סה״כ חודשי<b class="tnum">${fmt0(m)} ₪</b> · שנתי ${fmt0(y)} ₪</div></div>`;
  el.querySelectorAll('.ci-x').forEach(b=>b.onclick=()=>{state.cart=state.cart.filter(x=>x.uid!==b.dataset.uid);renderCart();});
  const cc=document.getElementById('cartClear');if(cc)cc.onclick=()=>{if(state.cart.length){state.cart=[];renderCart();}};
}
function addToCart(item){
  const k=(item.member||'')+'|'+item.coId+'|'+item.covKey+'|'+(item.sum||0);
  const ex=state.cart.find(x=>x.key===k);
  if(ex){Object.assign(ex,item,{key:k});}
  else{state.cart.push({...item,key:k,uid:'u'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)});}
  renderCart();
}
function addCurrentSelection(){
  const P=prod();if(!P)return;const coId=state.company,coName=CO[coId].name;let added=0;
  const mem=state.mode==='family'?(activeMem()?activeMem().label:''):'';
  currentKeys().forEach(key=>{const s=state.sel[key];if(!s||!s.on)return;
    const b=baseForKey(key);if(b<=0)return;const d=s.disc||state.agentDisc;
    addToCart({coId,coName,covKey:key,label:labelForKey(key),base:b,disc:d,pay:clientPrice(b,d),sum:isPer100kKey(key)?s.sum:0,member:mem});added++;});
  const btn=document.getElementById('addCartBtn');
  if(btn){btn.textContent=added?`✓ נוספו ${added} כיסויים לסל`:'סמנו כיסוי תחילה';setTimeout(()=>{if(btn)btn.textContent='➕ הוסף כיסויים אלה לסל ההצעה';},1400);}
}
function render(){
  const family=state.mode==='family';
  const showSingle=state.mode==='single'||(family&&state.familySub==='single');
  document.getElementById('singleView').style.display=showSingle?'':'none';
  document.getElementById('compareView').style.display=showSingle?'none':'';
  document.getElementById('companyField').style.display=showSingle?'':'none';
  document.getElementById('cmpSumField').style.display='none';
  document.getElementById('familyBar').style.display=family?'':'none';
  document.getElementById('memberLabelField').style.display=family?'':'none';
  if(family){renderFamilyBar();}
  if(showSingle)renderSingle(); else renderCompare();
}

/* ---- URL parameter pre-fill (for the Fireberry button) ---- */
(function prefill(){
  const q=new URLSearchParams(location.search);
  if(q.get('debug')==='1'){
    const parts=[...q.entries()].map(([k,v])=>k+'="'+v+'"');
    const bar=document.createElement('div');
    bar.style.cssText='background:#fff3cd;border:1px solid #c8962a;border-radius:8px;padding:10px 14px;margin-bottom:12px;font-size:12.5px;color:#5a4500;direction:ltr;text-align:left;font-family:monospace';
    bar.textContent='DEBUG · params received: '+(parts.length?parts.join('  '):'(none)');
    document.querySelector('.wrap').insertBefore(bar,document.querySelector('.top').nextSibling);
  }
  const nm=(q.get('name')||q.get('accountname')||'').trim();
  if(nm && !/[{}\[\]$]/.test(nm)){
    document.getElementById('cbName').textContent=nm;
    document.getElementById('clientBanner').style.display='flex';
    document.title=nm+' · סימולטור תעריפונים';
  }
  const setSeg=(id,v)=>{const seg=document.getElementById(id);if(!seg)return;
    seg.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));};
  if(q.has('age')){const a=parseInt(q.get('age'));if(!isNaN(a)){state.age=a;document.getElementById('age').value=a;}}
  let g=q.get('gender');if(g){g=g.toLowerCase().trim();
    if(['m','male','זכר','גבר','1'].includes(g))state.gender='M';
    else if(['f','female','נקבה','אישה','2'].includes(g))state.gender='F';
    setSeg('genderSeg',state.gender);}
  let s=(q.get('smoke')||q.get('smoker')||'');if(s){s=s.toLowerCase().trim();
    state.smoke=['1','true','yes','smk','smoker','כן','מעשן'].includes(s)?'smk':'non';
    setSeg('smokeSeg',state.smoke);}
  if(q.has('disc')){const d=clampDisc(q.get('disc'));state.agentDisc=d;document.getElementById('agentDisc').value=d;}
  if(q.has('sum')){const v=parseSum(q.get('sum'));if(v){state.cmpSum=v;}}
  if(q.get('mode')==='compare'){state.mode='compare';
    document.getElementById('modeSw').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.m==='compare'));}
  if(['life','mortgage','health'].includes(q.get('product')))state.product=q.get('product');
  if(['life','mk','cancer'].includes(q.get('cmp')))state.cmpKind=q.get('cmp');
})();

render();
renderCart();
</script>
</body>
